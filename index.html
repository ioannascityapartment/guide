<style>
:root{--ink:#17212b;--cream:#f5efe6;--blue:#123f55;--violet:#665cac;--muted:#667085;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.hero{min-height:360px;background:linear-gradient(rgba(5,28,38,.5),rgba(5,28,38,.6)),url('https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?auto=format&fit=crop&w=1600&q=80');background-size:cover;background-position:center;color:white;text-align:center;padding:22px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center}select{padding:10px;border-radius:12px;border:0}.badge{background:rgba(255,255,255,.2);border-radius:999px;padding:9px 13px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:400;margin:70px 0 8px}.hero p{font-size:24px;margin:0}
.shell{width:min(1180px,100%);margin:-38px auto 0;background:rgba(255,255,255,.96);border-radius:24px 24px 0 0;padding:24px;box-shadow:0 -10px 40px rgba(0,0,0,.15);min-height:420px}
.welcome{text-align:center}.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px 0}a,button{cursor:pointer}.btn{display:inline-block;background:var(--blue);color:white;border:0;border-radius:14px;padding:12px 16px;text-decoration:none;font-weight:800;font-family:system-ui}.viber{background:var(--violet)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.tile{background:white;border:1px solid #eee;border-radius:16px;min-height:115px;padding:15px;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.08)}.tile span{font-size:33px;display:block}.tile strong{font-size:17px}
.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 12px 32px rgba(15,23,42,.12)}.back{background:#eef7f5;color:#0f766e;border:0;border-radius:999px;padding:10px 14px;font-weight:800}
.place{border:1px solid #eee;border-radius:16px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:14px}.place h3{margin:0 0 6px;font-weight:500}.place p{margin:0;color:var(--muted);font-family:system-ui}.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.acts a{background:var(--blue);color:#fff;text-decoration:none;border-radius:999px;padding:9px 12px;font-family:system-ui;font-weight:800}.danger{background:var(--danger)!important}
.info{border:1px solid #eee;border-radius:14px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:12px}.muted{color:var(--muted);font-family:system-ui}.admin{display:block;margin:20px auto 0;background:#0b2330;color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:800}
input,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:12px;margin:6px 0 10px}.adminGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{border:1px solid #eee;border-radius:16px;padding:12px}footer{background:#0b2330;color:white;text-align:center;padding:18px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.place{display:block}.acts{justify-content:flex-start;margin-top:10px}.adminGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">Loading...</div>
<script type="module">

const T={el:{welcome:'Καλώς ήρθατε στην Κάλυμνο',intro:'Όλες οι χρήσιμες πληροφορίες για τη διαμονή σας.',back:'Πίσω',map:'Χάρτης',call:'Κλήση',open:'Άνοιγμα',login:'Σύνδεση',save:'Αποθήκευση',admin:'Admin',wifi:'Wi‑Fi',check:'Check‑in / Check‑out',location:'Τοποθεσία',house:'Οδηγίες σπιτιού',restaurants:'Εστιατόρια',souvlaki:'Σουβλατζίδικα',pizza:'Πιτσαρίες',coffee:'Καφέ & Delivery',bakery:'Φούρνοι',beaches:'Παραλίες',discover:'Ανακαλύψτε την Κάλυμνο',rentals:'Ενοικιάσεις',useful:'Χρήσιμες πληροφορίες',weather:'Καιρός Καλύμνου',airport:'Αεροδρόμιο Καλύμνου',port:'Λιμάνι Καλύμνου',contact:'Επικοινωνία',social:'Βρείτε μας',reviews:'Αξιολογήστε μας',emergency:'Έκτακτη ανάγκη',directions:'Οδηγίες'},en:{welcome:'Welcome to Kalymnos',intro:'All useful information for your stay.',back:'Back',map:'Map',call:'Call',open:'Open',login:'Login',save:'Save',admin:'Admin',wifi:'Wi‑Fi',check:'Check-in / Check-out',location:'Location',house:'House guide',restaurants:'Restaurants',souvlaki:'Souvlaki',pizza:'Pizzerias',coffee:'Coffee & Delivery',bakery:'Bakeries',beaches:'Beaches',discover:'Discover Kalymnos',rentals:'Rentals',useful:'Useful info',weather:'Kalymnos weather',airport:'Kalymnos Airport',port:'Kalymnos Port',contact:'Contact',social:'Find us',reviews:'Review us',emergency:'Emergency',directions:'Directions'}}
const generic={de:['Willkommen auf Kalymnos','Alle nützlichen Informationen für Ihren Aufenthalt.'],fr:['Bienvenue à Kalymnos','Toutes les informations utiles pour votre séjour.'],it:['Benvenuti a Kalymnos','Tutte le informazioni utili per il vostro soggiorno.'],es:['Bienvenidos a Kálimnos','Toda la información útil para su estancia.'],nl:['Welkom op Kalymnos','Alle nuttige informatie voor uw verblijf.'],pl:['Witamy na Kalymnos','Wszystkie przydatne informacje na czas pobytu.'],ro:['Bine ați venit în Kalymnos','Toate informațiile utile pentru șederea dumneavoastră.'],bg:['Добре дошли на Калимнос','Цялата полезна информация за престоя ви.'],tr:['Kalimnos’a hoş geldiniz','Konaklamanız için tüm yararlı bilgiler.'],sv:['Välkommen till Kalymnos','All användbar information för din vistelse.'],da:['Velkommen til Kalymnos','Alle nyttige oplysninger til dit ophold.'],no:['Velkommen til Kalymnos','All nyttig informasjon for oppholdet ditt.'],fi:['Tervetuloa Kalymnokselle','Kaikki hyödylliset tiedot oleskeluasi varten.'],cs:['Vítejte na Kalymnosu','Všechny užitečné informace pro váš pobyt.'],sr:['Добродошли на Калимнос','Све корисне информације за ваш боравак.'],sq:['Mirë se vini në Kalymnos','Të gjitha informacionet e dobishme për qëndrimin tuaj.'],uk:['Ласкаво просимо на Калімнос','Уся корисна інформація для вашого перебування.'],ru:['Добро пожаловать на Калимнос','Вся полезная информация для вашего пребывания.'],zh:['欢迎来到卡利姆诺斯','您住宿期间所需的全部实用信息。'],ja:['カリムノスへようこそ','ご滞在に役立つ情報をまとめています。'],ko:['칼림노스에 오신 것을 환영합니다','숙박에 필요한 모든 유용한 정보입니다.'],ar:['مرحبًا بكم في كاليمنوس','جميع المعلومات المفيدة لإقامتكم。']}
function tr(k){ if(T[lang]?.[k])return T[lang][k]; if(k==='welcome'&&generic[lang])return generic[lang][0]; if(k==='intro'&&generic[lang])return generic[lang][1]; return T.en[k]||T.el[k]||k }
const META={wifi:['📶','wifi'],check:['🔑','check'],location:['📍','location'],house:['🏠','house'],restaurants:['🍽️','restaurants'],souvlaki:['🌯','souvlaki'],pizza:['🍕','pizza'],coffee:['☕','coffee'],bakery:['🥐','bakery'],beaches:['🏖️','beaches'],discover:['🧽','discover'],rentals:['🚗','rentals'],useful:['🧭','useful'],weather:['🌤️','weather'],airport:['✈️','airport'],port:['⛴️','port'],contact:['☎️','contact'],social:['🌐','social'],reviews:['⭐','reviews'],emergency:['🚨','emergency']}
let lang=localStorage.lang||'el', screen='home', property=null, places=[], user=null
const DEFAULT={name:"Ioanna's City Apartment",location:'Καλαμιώτισσα, Πόθια, Κάλυμνος',welcome_title:'Καλώς ήρθατε στην Κάλυμνο',welcome_text:'Όλες οι χρήσιμες πληροφορίες για τη διαμονή σας.',wifi_name:'IoannasCityApartment',wifi_password:'NIKOS1991',checkin:'15:00',checkout:'11:00',house_rules:'Κλείνετε τα κλιματιστικά όταν απουσιάζετε.\nΕνεργοποιήστε τον θερμοσίφωνα περίπου 20 λεπτά πριν τη χρήση.\nΏρες κοινής ησυχίας: 23:00–07:00.',phone_1:'6945056864',phone_2:'6945068677',viber_phone:'306945056864',email:'Ioannascityapartment@gmail.com',map_url:'https://maps.app.goo.gl/FPd6cxNEdGLeLw5HA'}
async function load(){try{let ps=await supabase.from('properties').select('*').eq('active',true).limit(1); property=ps.data?.[0]||DEFAULT; let pl=await supabase.from('guide_places').select('*').eq('active',true).order('category').order('sort_order'); places=pl.data||[]}catch(e){console.error(e);property=DEFAULT} render()}
function esc(s){return String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function header(){return `<header class="hero"><div class="top"><div class="badge">Kalymnos Guest Guide</div><select id="lang">${LANG.map(([c,l])=>`<option value="${c}" ${c===lang?'selected':''}>${l}</option>`).join('')}</select></div><h1>${esc(property?.name||'Ioanna')}</h1><p>${esc(property?.location||'Kalymnos')}</p></header>`}
function home(){return `<section class="welcome"><h2>${esc(property?.welcome_title||tr('welcome'))}</h2><p class="muted">${esc(property?.welcome_text||tr('intro'))}</p></section><div class="quick"><a class="btn" href="tel:+30${esc(property.phone_1)}">📞 ${tr('call')}</a><a class="btn viber" href="viber://chat?number=%2B${esc(property.viber_phone)}">💜 Viber</a><a class="btn" target="_blank" href="${esc(property.map_url)}">📍 ${tr('directions')}</a></div><div class="grid">${Object.entries(META).map(([id,[ic,k]])=>`<button class="tile" data-screen="${id}"><span>${ic}</span><strong>${tr(k)}</strong></button>`).join('')}</div><button class="admin" data-screen="admin">${tr('admin')}</button>`}
function section(id){const [ic,k]=META[id]||['📍',id]; if(id==='wifi')return panel(`${ic} ${tr(k)}`,`<div class="info"><span>Network</span><b>${esc(property.wifi_name)}</b></div><div class="info"><span>Password</span><b>${esc(property.wifi_password)}</b></div>`)
if(id==='check')return panel(`${ic} ${tr(k)}`,`<div class="info"><span>Check-in</span><b>${esc(property.checkin)}</b></div><div class="info"><span>Check-out</span><b>${esc(property.checkout)}</b></div>`)
if(id==='house')return panel(`${ic} ${tr(k)}`,`<ul>${esc(property.house_rules).split('\n').map(x=>`<li>${x}</li>`).join('')}</ul>`)
if(id==='location')return panel(`${ic} ${tr(k)}`,`<a class="btn" target="_blank" href="${esc(property.map_url)}">📍 ${tr('directions')}</a>`)
if(id==='contact')return panel(`${ic} ${tr(k)}`,`<div class="quick"><a class="btn" href="tel:+30${esc(property.phone_1)}">📞 ${esc(property.phone_1)}</a><a class="btn" href="tel:+30${esc(property.phone_2)}">📞 ${esc(property.phone_2)}</a><a class="btn viber" href="viber://chat?number=%2B${esc(property.viber_phone)}">💜 Viber</a><a class="btn" href="mailto:${esc(property.email)}">✉️ Email</a></div>`)
if(id==='weather')return panel(`${ic} ${tr(k)}`,`<a class="btn" target="_blank" href="https://www.google.com/search?q=Kalymnos+weather">${tr('open')}</a>`)
let arr=places.filter(p=>p.category===id); return panel(`${ic} ${tr(k)}`,`${id==='emergency'?'<p class="muted"><b>Σε άμεσο κίνδυνο καλέστε 112.</b></p>':''}${arr.length?arr.map(place).join(''):'<p class="muted">Θα προστεθεί περιεχόμενο.</p>'}`)}
function panel(title,body){return `<section class="panel"><button class="back" data-screen="home">← ${tr('back')}</button><h2>${title}</h2>${body}</section>`}
function place(p){return `<article class="place"><div><h3>${esc(p.name)}</h3><p>${esc(p.description)}</p></div><div class="acts">${p.map_url?`<a target="_blank" href="${esc(p.map_url)}">📍 ${tr('map')}</a>`:''}${p.phone?`<a class="${p.category==='emergency'?'danger':''}" href="tel:${esc(p.phone)}">📞 ${esc(p.phone)}</a>`:''}${p.url?`<a target="_blank" href="${esc(p.url)}">${tr('open')}</a>`:''}</div></article>`}
function admin(){return panel('🔐 Admin',`<input id="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" id="login">${tr('login')}</button><p class="muted">Για αλλαγές περιεχομένου χρησιμοποίησε το Supabase/Admin που ήδη έχουμε ρυθμίσει.</p>`)}
function render(){document.documentElement.lang=lang; document.getElementById('app').innerHTML=header()+`<main class="shell">${screen==='home'?home():screen==='admin'?admin():section(screen)}</main><footer>${esc(property?.name||'')} · Kalymnos</footer>`; document.querySelector('#lang')?.addEventListener('change',e=>{lang=e.target.value;localStorage.lang=lang;render()}); document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>{screen=b.dataset.screen;render();scrollTo(0,0)}); document.querySelector('#login')?.addEventListener('click',async()=>{const email=document.querySelector('#email').value, password=document.querySelector('#pass').value; const {error}=await supabase.auth.signInWithPassword({email,password}); alert(error?error.message:'Συνδέθηκες επιτυχώς')})}
load()
